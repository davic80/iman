{{define "base"}}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- La instancia es privada. Que no acabe en un buscador. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>{{block "titulo" .}}Imán{{end}}</title>
<link rel="stylesheet" href="/estaticos/estilo.css">
<link rel="icon" href="/estaticos/iman.svg" type="image/svg+xml">
</head>
<body>
<header class="cabecera">
  <a class="marca" href="/">
    <span class="marca-icono">🧲</span>
    <span class="marca-nombre">Imán</span>
  </a>
  <nav>
    <a href="/novedades">Novedades</a>
    <a href="/salud">Salud</a>
  </nav>
</header>

<main>
{{block "contenido" .}}{{end}}
</main>

{{if .TMDB}}
<!-- El visor de carátulas. Uno solo para toda la página: lo rellena el JS con
     lo que trae el botón que se ha pinchado. Sale vacío y sin ocupar sitio, y
     si no hay JavaScript no se abre nunca y no estorba a nadie. -->
<dialog id="visor" class="visor">
  <form method="dialog">
    <button class="visor-cerrar" aria-label="Cerrar">×</button>
  </form>
  <img class="visor-cartel" alt="">
  <div class="visor-datos">
    <h2 class="visor-titulo"></h2>
    <p class="visor-meta"></p>
    <p class="visor-sinopsis"></p>
  </div>
</dialog>
{{end}}

<footer class="pie">
  <span>Imán · {{.Version}}</span>
  {{if .TMDB}}
  <!-- El crédito es la condición de TMDB para dejar usar su API gratis. -->
  <span class="pie-tmdb">
    Carátulas de <a href="https://www.themoviedb.org/" rel="noreferrer">TMDB</a>.
    Imán usa su API, pero TMDB ni lo avala ni lo certifica.
  </span>
  {{end}}
</footer>
<script src="/estaticos/iman.js" defer></script>
</body>
</html>{{end}}
